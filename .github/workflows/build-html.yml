name: Render All PHP to HTML

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Render all PHP files to HTML
        run: |
          find . -name "*.php" -type f | while read -r file; do
            html_file="${file%.php}.html"
            echo "Rendering $file -> $html_file"
            php "$file" > "$html_file"
          done

      - name: Commit rendered HTML files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto-render: generate .html files from .php scripts"
          file_pattern: "*.html"
